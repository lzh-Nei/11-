# AIES dev网关：80/443 → app:8080 反代
# 443证书为本地自签（docker/nginx/certs/，已被gitignore；生成：同目录gen-cert.ps1）

# ===== 网关限流（第一道闸；应用层 Redis 限流为第二道） =====
# 认证敏感接口：10 次/分钟/IP，允许 5 个突发
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
# 其余 API：20 次/秒/IP，允许 40 个突发
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
# 单 IP 并发连接上限
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
# 被限流统一返回 429（与应用层 30010 的 HTTP 状态对齐）
limit_req_status 429;
limit_conn_status 429;
# 若前置有 SLB/CDN，请追加 real_ip_header X-Forwarded-For 与 set_real_ip_from 可信网段

server {
    listen 80;
    server_name _;

    # 健康探针：/api/health → app actuator（G1冒烟口径，dev宿主端口8082）
    location = /api/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # 实时评价状态 WebSocket（/ws?token=...）
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # 认证敏感接口：登录/注册/发码/找回（/me、/logout 不在限流内）
    location ~ ^/api/auth/(login|register|email-code|password/) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # API 反代（/api → app；前端 baseURL='/api' 同源相对路径）
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # 前端 SPA 静态托管（compose 挂载 frontend/dist；history 路由回退 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 100m;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/aies.crt;
    ssl_certificate_key /etc/nginx/certs/aies.key;

    # WebSocket 实时通道
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # 认证敏感接口：登录/注册/发码/找回（/me、/logout 不在限流内）
    location ~ ^/api/auth/(login|register|email-code|password/) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_conn conn_limit 10;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_conn conn_limit 20;
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
