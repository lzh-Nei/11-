# AIES dev网关：80/443 → app:8080 反代
# 443证书为本地自签（docker/nginx/certs/，已被gitignore；生成：同目录gen-cert.ps1）
server {
    listen 80;
    server_name _;

    # 健康探针：/api/health → app actuator（G1冒烟口径，dev宿主端口8082）
    location = /api/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
    }

    # API 反代（/api → app；前端 baseURL='/api' 同源相对路径）
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }

    # 前端 SPA 静态托管（compose 挂载 frontend/dist；history 路由回退 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        client_max_body_size 100m;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/aies.crt;
    ssl_certificate_key /etc/nginx/certs/aies.key;

    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
