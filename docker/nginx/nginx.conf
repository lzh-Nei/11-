# AIES dev网关：80/443 → app:8080 反代
# 443证书为本地自签（docker/nginx/certs/，已被gitignore；生成：同目录gen-cert.ps1）
server {
    listen 80;
    server_name _;

    # 健康探针：/api/health → app actuator（G1冒烟口径，dev宿主端口8081）
    location = /api/health {
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/aies.crt;
    ssl_certificate_key /etc/nginx/certs/aies.key;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 100m;
    }
}
