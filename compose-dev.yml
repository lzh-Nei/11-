# =====================================================================
# AIES compose-dev：8容器一键开发环境（G1，对齐06-部署框架V0.9 §二 + 本批T7）
#   nginx / app / mysql / redis / rabbitmq / minio / ollama / ocr
#   另含2个init一次性容器：minio-init（建bucket）、ollama-init（拉7B模型）
# 使用：1) cp .env.example .env 并填值  2) docker compose -f compose-dev.yml up -d
# 冒烟：compose ps 全healthy → curl localhost/api/health → app /actuator/health UP
# =====================================================================
name: aies-dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在.env设置MYSQL_PASSWORD}
      MYSQL_DATABASE: ai_evaluate
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"          # dev对外；生产（W11）收敛
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"        # 管理台 dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在.env设置MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"          # 控制台 dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性：初始化三bucket（对齐T7：homework-hot / homework-cold / backup）
  # ⚠️ 偏差登记：03-02 §四写swe-hot/swe-cold，本批按T7指令用homework-*，待文档同步或回改
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在.env设置MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/homework-hot &&
      mc mb --ignore-existing local/homework-cold &&
      mc mb --ignore-existing local/backup &&
      echo 'buckets-ready'"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一次性：拉取7B模型（约4GB，首启较慢；模型卷持久化，仅首次执行）
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: >
      /bin/sh -c "echo 'pulling '$$OLLAMA_MODEL' ...' && ollama pull $$OLLAMA_MODEL && echo 'model-ready'"

  # 🟡 占位：W6(A3)替换为真实PaddleOCR解析服务；当前预装依赖+占位HTTP保障G1链路冒烟
  ocr:
    image: python:3.11-slim
    command: >
      /bin/sh -c "pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple paddlepaddle==2.6.1 paddleocr &&
      python -m http.server 8868"
    ports:
      - "8868:8868"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8868/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  app:
    image: eclipse-temurin:21-jre
    working_dir: /app
    # dev形态：挂载宿主 mvn package 产物；生产镜像构建（06-部署框架）W11落地
    command: java -jar /app/aies-server-1.0.0.jar
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在.env设置MYSQL_PASSWORD}
      REDIS_HOST: redis
      JAVA_OPTS: "-XX:+UseZGC"
    ports:
      - "8080:8080"          # dev直连调试；标准链路经nginx
    volumes:
      - ./backend/target:/app:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully   # 两段式第二段：模型就绪才放行
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  minio_data:
  ollama_models:
