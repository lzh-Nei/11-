# =====================================================================
# AIES compose-dev：8容器一键开发环境（G1，对齐06-部署框架V0.9 §二 + 本批T7）
#   nginx / app / mysql / redis / rabbitmq / minio / ollama / ocr
#   另含2个init一次性容器：minio-init（建bucket）、ollama-init（拉7B模型）
# 使用：1) cp .env.example .env 并填值  2) docker compose -f compose-dev.yml up -d
# 冒烟：compose ps 全healthy → curl localhost/api/health → app /actuator/health UP
# =====================================================================
name: aies-dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在.env设置MYSQL_PASSWORD}
      MYSQL_DATABASE: ai_evaluate
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "13306:3306"         # dev对外改道13306：宿主原生MySQL占3306/33060；容器内仍3306，app走内网不受影响
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"          # dev对外改道6380：宿主原生Redis已占6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"        # 管理台 dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在.env设置MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"          # 控制台 dev
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 一次性：初始化bucket（用户裁决：swe-hot/swe-cold对齐03-02 §四；backup为T7增量待03-02补录）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请在.env设置MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/swe-hot &&
      mc mb --ignore-existing local/swe-cold &&
      mc mb --ignore-existing local/backup &&
      echo 'buckets-ready'"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU直通（W7-C2）：qwen2.5:7b Q4_K_M≈4.7GB，8GB显存4060整模进VRAM；
    # KV cache q8_0省显存、keep_alive=-1常驻防反复加载（ADR-001本地推理）；
    # NUM_PARALLEL=2双槽并发（KV cache 2×119MB≈238MB，显存余量充足）——
    # 配合GoldenEvalRunner双线程送评，12样本送评耗时约减半
    environment:
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_KEEP_ALIVE: -1
      OLLAMA_NUM_PARALLEL: 2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # ollama镜像无curl：用自带CLI做就绪探针（ollama list即访问本地API）
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # 一次性：拉取7B模型（约4GB，首启较慢；模型卷持久化，仅首次执行）
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: >
      /bin/sh -c "echo 'pulling '$$OLLAMA_MODEL' ...' && ollama pull $$OLLAMA_MODEL && echo 'model-ready'"

  # 🟡 占位：W6(A3)替换为真实PaddleOCR解析服务；当前预装依赖+占位HTTP保障G1链路冒烟
  ocr:
    image: python:3.11-slim
    command: >
      /bin/sh -c "pip install --no-cache-dir -i https://mirrors.aliyun.com/pypi/simple/ paddlepaddle==2.6.2 paddleocr==2.7.3 &&
      python -m http.server 8868"
    ports:
      - "8868:8868"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8868/')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40

  app:
    image: eclipse-temurin:21-jre
    working_dir: /app
    # dev形态：挂载宿主 mvn package 产物；生产镜像构建（06-部署框架）W11落地
    command: java -jar /app/aies-server-1.0.0.jar
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在.env设置MYSQL_PASSWORD}
      REDIS_HOST: redis
      TZ: Asia/Shanghai           # 业务时间统一东八区：LocalDateTime.now() 与 MySQL DEFAULT CURRENT_TIMESTAMP 对齐
      JAVA_OPTS: "-XX:+UseZGC"
      FILESTORE_BASEDIR: /data/storage   # filestore.base-dir：/app为ro挂载，存储走独立卷
      JWT_SECRET: ${JWT_SECRET:?请在.env设置JWT_SECRET}   # HS512≥64字节（S-14零明文）
      SMTP_HOST: ${SMTP_HOST:-}            # UC-42邮箱码（R-06账号申请中；空=模拟发送降级）
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FILESTORE_MODE: minio                # D-23兑现（W7-C1）：swe-hot真实落桶
      MINIO_ENDPOINT: http://minio:9000    # 容器内网络直连
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000  # 浏览器签名URL用宿主映射端口
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请在.env设置MINIO_ROOT_PASSWORD}
      RABBITMQ_HOST: rabbitmq              # UC-16解析异步链（W7-C1）
      OLLAMA_BASE_URL: http://ollama:11434 # UC-20 AI评分链（W7-C2），LlmClient唯一出口
      AI_CONFIG_SECRET: ${AI_CONFIG_SECRET:-aies-dev-config-secret-change-me} # API Key 加密密钥（生产必须覆盖）
    ports:
      - "8080:8080"          # dev直连调试；标准链路经nginx
    volumes:
      - ./backend/target:/app:ro
      - app_storage:/data/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully   # 两段式第二段：模型就绪才放行
    healthcheck:
      # temurin JRE镜像无curl；/dev/tcp是bash特性而CMD-SHELL走sh(dash)不支持，故显式CMD调用bash；127.0.0.1避免localhost解析IPv6误报
      test: ["CMD", "bash", "-c", "(echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "8082:80"            # dev改道8082：宿主8081被nexus私服占用（D-32裁决改映射不停nexus）；标准链路W11生产环境恢复80
      - "9443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro   # 前端SPA托管（npm run build产物；W12运行形态：8082单入口=静态+API）
    depends_on:
      - app
    healthcheck:
      # alpine镜像用busybox wget替代curl；用127.0.0.1避免localhost解析IPv6(::1)探针误报
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  minio_data:
  ollama_models:
  app_storage:
