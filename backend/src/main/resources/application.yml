server:
  port: 8000

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_evaluate?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your_deepseek_key}
    base-url: https://api.deepseek.com
  claude:
    api-key: ${CLAUDE_API_KEY:your_claude_key}
    base-url: ${CLAUDE_BASE_URL:your_claude_proxy_url}