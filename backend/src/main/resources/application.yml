server:
  port: 8080
  tomcat:
    # 高并发下载支撑点：每个下载请求占用一个线程做流式写出
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 200

spring:
  datasource:
    # 凭据一律走环境变量（.env / compose注入），仓库内不得出现真实密码（红线4）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/ai_evaluate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 建库唯一事实源：classpath:db/migration（V1__rbac.sql 五表RBAC起）
    locations: classpath:db/migration
    baseline-on-move: false
    validate-on-migrate: true
    out-of-order: false
    # 红线（04-08 §四）：任何环境禁用 clean
    clean-disabled: true
  rabbitmq:
    # UC-16 解析异步链（W7-C1）：上传PENDING→发MQ→worker置QUEUED→SUCCESS/FAILED
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 解析失败由 worker 捕获置 FAILED 后正常 ack，不 requeue 死循环
        default-requeue-rejected: false
  data:
    redis:
      # 图形验证码、短信验证码都存放在 Redis；本地没有 Redis 时请先启动
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      # 单个分片大小上限
      max-file-size: 20MB
      # 小文件批量上传时一次请求允许的总字节数
      max-request-size: 100MB
  mail:
    # UC-42邮箱验证码通道（A-06/A-07/A-10）：SMTP_*由.env注入；
    # host为空时 MailSenderAutoConfiguration 不装配 JavaMailSender，EmailCodeService自动降级为模拟发送
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # HS512密钥：≥64字节，.env注入（S-14密钥零明文）；缺失时启动即失败（JwtService校验）
  secret: ${JWT_SECRET:}
  # S-10：AT 2h / RT 7d旋转
  access-token-minutes: 120
  refresh-token-days: 7

auth:
  captcha:
    expire-seconds: 300
    width: 120
    height: 40
    code-count: 4
    interfere-count: 20
  email:
    # 邮箱验证码（UC-42/43/44；D-19后唯一验证码通道）
    expire-seconds: 300
    cooldown-seconds: 60
    hourly-limit: 5
    max-attempts: 5
    # 未配置SMTP_HOST时模拟发送（验证码打日志，R-06账号申请中）；expose-code仅模拟模式生效
    expose-code: true

filestore:
  # 本地 FileStoreService 根目录（分片上传演示域沿用本地实现）
  base-dir: ./storage

management:
  health:
    # SMTP账号办理中（SMTP_HOST/USER已填、PASSWORD空）：mail探针每次健康检查连SMTP刷
    # AuthenticationFailedException 且拖低/actuator/health；账号就绪后可移除此行
    mail:
      enabled: false

filestorage:
  # 对象存储模式：minio（dev容器/生产，swe-hot真实落桶，D-23）/ local（无容器兜底+单测）
  mode: ${FILESTORE_MODE:local}
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket-hot: swe-hot
  bucket-cold: swe-cold

ai:
  # LLM基础设施配置（W7-C2；运行参数model/temperature/timeout/max_retry一律llm_config表读取，红线R4）
  client: ollama                     # LlmClient装配开关（OllamaLlmClient默认；单测MockLlmClient不经此装配）
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  semaphore:
    permits: 2                       # 本地显存并发约束（03-01 §三）
    queue-warn-seconds: 30           # 排队超30s打WARN（规范§三）
  prompt:
    text-limit: 12000                # 提取文本塞入模板前截断上限（保头保尾）

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your_deepseek_key}
    base-url: https://api.deepseek.com
  claude:
    api-key: ${CLAUDE_API_KEY:your_claude_key}
    base-url: ${CLAUDE_BASE_URL:your_claude_proxy_url}