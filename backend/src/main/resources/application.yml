server:
  port: 8000
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 30m
  tomcat:
    uri-encoding: UTF-8
    max-threads: 200
    min-spare-threads: 10
    max-connections: 10000
    accept-count: 100
    connection-timeout: 30000
    max-swallow-size: 100MB
    max-http-form-post-size: 100MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2MB
  datasource:
    url: jdbc:mysql://localhost:3306/ai_evaluate?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your_deepseek_key}
    base-url: https://api.deepseek.com
  claude:
    api-key: ${CLAUDE_API_KEY:your_claude_key}
    base-url: ${CLAUDE_BASE_URL:your_claude_proxy_url}