server:
  port: 8000
  tomcat:
    # 高并发下载支撑点：每个下载请求占用一个线程做流式写出
    threads:
      max: 400
      min-spare: 50
    max-connections: 10000
    accept-count: 200

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_evaluate?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: yourpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 图形验证码、短信验证码都存放在 Redis；本地没有 Redis 时请先启动
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      # 单个分片大小上限
      max-file-size: 20MB
      # 小文件批量上传时一次请求允许的总字节数
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  # 前端请求头：Authorization: Bearer <token>
  token-name: Authorization
  token-prefix: Bearer
  # token 有效期 30 天；30 分钟无操作则过期
  timeout: 2592000
  active-timeout: 1800
  # 允许同一账号多端登录，每次登录签发独立 token
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  # 只从请求头读取 token，不读 Cookie / 请求参数，避免 CSRF 与 token 泄漏
  is-read-cookie: false
  is-read-header: true
  is-read-body: false

auth:
  captcha:
    expire-seconds: 300
    width: 120
    height: 40
    code-count: 4
    interfere-count: 20
  sms:
    expire-seconds: 300
    cooldown-seconds: 60
    max-attempts: 5
    # 课程作业没有真实短信通道：验证码只打日志，并按需在接口响应中返回
    mock: true
    expose-code: true

filestore:
  # 文件存储根目录（相对项目运行目录）
  base-dir: ./storage

llm:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your_deepseek_key}
    base-url: https://api.deepseek.com
  claude:
    api-key: ${CLAUDE_API_KEY:your_claude_key}
    base-url: ${CLAUDE_BASE_URL:your_claude_proxy_url}